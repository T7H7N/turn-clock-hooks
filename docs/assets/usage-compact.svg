<svg xmlns="http://www.w3.org/2000/svg" width="390" height="605" viewBox="0 0 390 605" role="img" aria-labelledby="title desc" xml:lang="en"><title id="title">Read the clock after a batch</title><desc id="desc">PS&gt; $eventJson = '{"hook_event_name":"PostToolBatch"}'. PS&gt; $reply = $eventJson | python -I -B turn-clock/hook.py. PS&gt; ($reply | ConvertFrom-Json).hookSpecificOutput.additionalContext. Output: Tool batch ended: 2026-11-27T13:12:17+00:00 (Fri) | UTC: 2026-11-27T13:12:17Z.</desc><rect width="390" height="605" fill="#f6f5f1"/><rect width="5" height="605" fill="#172529"/><path d="M17 44H374" stroke="#172529"/>
