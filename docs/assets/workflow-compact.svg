<svg xmlns="http://www.w3.org/2000/svg" width="400" height="730" viewBox="0 0 400 730" role="img" aria-labelledby="title desc" xml:lang="en"><title id="title">Six independent hooks mapped to their host events</title><desc id="desc">UserPromptSubmit adds the clock and seven-day preview. PreToolUse selects Shell dialect for PowerShell, Inline path for Bash, or Read window for Read. PostToolUse selects Script BOM for Write or Edit and Markdown lines for Write. PostToolBatch refreshes the clock on hosts that support it.</desc>
