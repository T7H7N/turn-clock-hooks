<svg xmlns="http://www.w3.org/2000/svg" width="416" height="204" viewBox="0 0 416 204" role="img" aria-labelledby="title desc"><title id="title">turn-clock-hooks workflow</title><desc id="desc">Prompt and tool-batch events feed the turn clock, while five other hooks check commands, reads, and writes.</desc><g font-family="Segoe UI, Helvetica, Arial, sans-serif"><rect x="0" y="0" width="416" height="204" rx="14" fill="#101B2C" stroke="none"/><rect x="13" y="11" width="390" height="56" rx="9" fill="#1A293C" stroke="#3C4D60"/><g transform="translate(36 39)"><path d="M0 -10a10 10 0 1 1 -.1 0 M0 -6v6l5 3" fill="none" stroke="#8CCFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="60" y="35" font-size="18" fill="#F3F6F8" font-weight="650" >Prompt / tool batch</text><text x="60" y="55" font-size="14" fill="#CED9E3" font-weight="400" >Turn clock: date preview or refreshed time.</text><rect x="13" y="73" width="390" height="56" rx="9" fill="#1A293C" stroke="#3C4D60"/><g transform="translate(36 101)"><path d="M-8 -8h16 M-8 0h16 M-8 8h16 M-3 -11v6 M4 -3v6 M-4 5v6" fill="none" stroke="#8CCFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="60" y="97" font-size="18" fill="#F3F6F8" font-weight="650" >Before tool use</text><text x="60" y="117" font-size="14" fill="#CED9E3" font-weight="400" >Shell dialect, inline path, read window.</text><rect x="13" y="135" width="390" height="56" rx="9" fill="#1A293C" stroke="#3C4D60"/><g transform="translate(36 163)"><path d="M-8 -11h12l5 5v17H-8z M4 -11v6h5 M-4 0h8 M-4 5h6" fill="none" stroke="#8CCFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="60" y="159" font-size="18" fill="#F3F6F8" font-weight="650" >After a write</text><text x="60" y="179" font-size="14" fill="#CED9E3" font-weight="400" >Script BOM and Markdown line advisories.</text></g></svg>
