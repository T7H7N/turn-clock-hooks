<svg xmlns="http://www.w3.org/2000/svg" width="870" height="198" viewBox="0 0 870 198" role="img" aria-labelledby="title desc"><title id="title">turn-clock-hooks workflow</title><desc id="desc">Prompt and tool-batch events feed the turn clock, while five other hooks check commands, reads, and writes.</desc><g font-family="Segoe UI, Helvetica, Arial, sans-serif"><rect x="0" y="0" width="870" height="198" rx="14" fill="#101B2C" stroke="none"/><rect x="18" y="12" width="219" height="52" rx="9" fill="#1A293C" stroke="#3C4D60"/><g transform="translate(42 38)"><path d="M0 -10a10 10 0 1 1 -.1 0 M0 -6v6l5 3" fill="none" stroke="#8CCFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="65" y="45" font-size="19" fill="#F3F6F8" font-weight="600" >Prompt / batch</text><path d="M239 38 H276" fill="none" stroke="#8CCFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M270 33 l6 5 -6 5" fill="none" stroke="#8CCFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="293" y="34" font-size="19" fill="#F3F6F8" font-weight="650" >Turn clock</text><text x="293" y="55" font-size="16" fill="#CED9E3" font-weight="400" >Date preview / refreshed time</text><rect x="18" y="71" width="219" height="52" rx="9" fill="#1A293C" stroke="#3C4D60"/><g transform="translate(42 97)"><path d="M-8 -8h16 M-8 0h16 M-8 8h16 M-3 -11v6 M4 -3v6 M-4 5v6" fill="none" stroke="#8CCFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="65" y="104" font-size="19" fill="#F3F6F8" font-weight="600" >Before tool use</text><path d="M239 97 H276" fill="none" stroke="#8CCFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M270 92 l6 5 -6 5" fill="none" stroke="#8CCFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="293" y="93" font-size="19" fill="#F3F6F8" font-weight="650" >Command and read checks</text><text x="293" y="114" font-size="16" fill="#CED9E3" font-weight="400" >Shell dialect  /  Inline path  /  Read window</text><rect x="18" y="130" width="219" height="52" rx="9" fill="#1A293C" stroke="#3C4D60"/><g transform="translate(42 156)"><path d="M-8 -11h12l5 5v17H-8z M4 -11v6h5 M-4 0h8 M-4 5h6" fill="none" stroke="#8CCFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="65" y="163" font-size="19" fill="#F3F6F8" font-weight="600" >After a write</text><path d="M239 156 H276" fill="none" stroke="#8CCFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M270 151 l6 5 -6 5" fill="none" stroke="#8CCFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="293" y="152" font-size="19" fill="#F3F6F8" font-weight="650" >File advisories</text><text x="293" y="173" font-size="16" fill="#CED9E3" font-weight="400" >Script BOM  /  Markdown lines</text></g></svg>
