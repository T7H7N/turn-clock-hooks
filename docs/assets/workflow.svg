<svg xmlns="http://www.w3.org/2000/svg" width="930" height="495" viewBox="0 0 930 495" role="img" aria-labelledby="title desc" xml:lang="en"><title id="title">Six independent hooks mapped to their host events</title><desc id="desc">UserPromptSubmit adds the clock and seven-day preview. PreToolUse selects Shell dialect for PowerShell, Inline path for Bash, or Read window for Read. PostToolUse selects Script BOM for Write or Edit and Markdown lines for Write. PostToolBatch refreshes the clock on hosts that support it.</desc>
<rect x="0" y="0" width="930" height="1300" fill="#f6f5f1" stroke="none" stroke-width="1"/>
<rect x="0" y="0" width="8" height="1300" fill="#2b567f" stroke="none" stroke-width="1"/>
<line x1="28" y1="53" x2="904" y2="53" stroke="#2b567f" stroke-width="1"/>
<text x="28" y="36" font-family="Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="700" fill="#2b567f" letter-spacing="1.2">TURN CLOCK HOOKS  /  EVENT MAP</text>
<text x="28" y="100" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="400" fill="#172529">Six hooks on four host events</text>
<text x="30" y="138" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#486065">The clock runs at the boundaries. Tool checks run only on matching calls.</text>
<line x1="28" y1="158" x2="900" y2="158" stroke="#bec9c5" stroke-width="1"/>
<line x1="43" y1="197" x2="43" y2="445" stroke="#2b567f" stroke-width="2"/>
<text x="352" y="179" font-family="Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="700" fill="#486065">HOOK</text>
<text x="640" y="179" font-family="Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="700" fill="#486065">MATCH OR OUTPUT</text>
