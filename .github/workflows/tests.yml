name: Hook tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run six hook suites
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import sys

          for folder in ("turn-clock", "shell-dialect", "inline-path", "script-bom", "markdown-lines", "read-window"):
              subprocess.run([sys.executable, "-B", "test_hook.py"], cwd=Path(folder), check=True)
      - name: Check registrations and report startup timings
        run: python -B install_check.py --report-timing
